# Secret Configuration file for MongoDB credentials in Kubernetes
apiVersion: v1 # The v1 group is used for managing secrets in Kubernetes
kind: Secret # The kind of resource being created (Secret)
metadata:
  name: mongodb-secret # Name of the secret
type: Opaque # Type of the secret
data: # Data for the secret
  mongo-root-username: S3JpelVzZXJuYW1l # Base64 encoded value for MongoDB root username, on MS PowerShell [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes('KrizUsername'))
  mongo-root-password: UGFzc1g0NA== # Base64 encoded value for MongoDB root password, on MS PowerShell [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes('PassX44'))